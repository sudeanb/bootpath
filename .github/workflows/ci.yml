name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib qemu-system-x86
      - name: build image
        run: make all
      - name: boot test (QEMU, headless, hard marker assertions)
        run: make boot-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: structural tests (page/code drift guard)
        run: node --test

  deploy-playground:
    runs-on: ubuntu-latest
    needs: build-boot
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: bundle walkthrough data into the playground
        run: |
          cp -r stages playground/stages
          cp -r docs playground/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground
      - id: deployment
        uses: actions/deploy-pages@v4
